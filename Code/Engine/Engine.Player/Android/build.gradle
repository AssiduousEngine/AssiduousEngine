plugins {
    id 'com.android.application' version '8.11.1' apply false
}

// What scripts/android-app.sh staged (jniLibs, assets) and where the build goes: outside the
// source tree, so the checkout holds only this project's sources.
def staged = file(providers.gradleProperty('engineStaged').getOrElse("${rootDir}/../../../../build/android-app/default"))
allprojects {
    layout.buildDirectory = new File(staged, "gradle/${project.name}")
}
